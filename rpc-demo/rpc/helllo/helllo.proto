syntax = "proto3";

package helllo;
option go_package="./helllo";

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

message HelloWorldRequest {
  string name = 1;
}

message HelloWorldResponse {
  string message = 1;
}

service Helllo {
  rpc Ping(Request) returns(Response);
  rpc HelloWorld(HelloWorldRequest) returns(HelloWorldResponse);
}
